name: Prepare build environment
description: Installs system packages, Rust and the Chromium engine used by Wazzup.

inputs:
  cache-key:
    description: Extra key that separates Cargo caches.
    required: false
    default: default
  cef-version:
    description: Version of the cef crate whose engine is downloaded.
    required: false
    default: "156.7.0+156.0.31"

runs:
  using: composite
  steps:
    - name: Install system packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          build-essential cmake ninja-build pkg-config patchelf file curl \
          desktop-file-utils appstream librsvg2-common \
          libgtk-4-dev libadwaita-1-dev \
          libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
          libdrm2 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
          libasound2t64 libpango-1.0-0 libcairo2 libdbus-1-3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}

    - name: Cache the Chromium engine
      id: engine-cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.cef
        key: cef-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cef-version }}

    - name: Download the Chromium engine
      if: steps.engine-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cargo install export-cef-dir --version "${{ inputs.cef-version }}" --locked
        export-cef-dir --force "${{ github.workspace }}/.cef"

    - name: Point the build at the engine
      shell: bash
      run: echo "CEF_PATH=${{ github.workspace }}/.cef" >> "${GITHUB_ENV}"
