name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: AppImage (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          cache-key: release-${{ matrix.architecture }}

      - name: Use the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "WAZZUP_VERSION=${version}" >> "${GITHUB_ENV}"
          sed -i "0,/^version = .*/s//version = \"${version}\"/" Cargo.toml

      - name: Run every check
        run: python3 waz-cmd.py check

      - name: Build AppImage
        run: python3 waz-cmd.py appimage

      - name: Keep the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: wazzup-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: appimage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Collect AppImages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Wazzup ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
