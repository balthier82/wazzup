[package]
name = "wazzup"
version = "0.1.0"
edition = "2024"
description = "WhatsApp on your GNOME desktop"
license = "GPL-3.0-or-later"
repository = "https://github.com/balthier82/wazzup"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
argon2 = "0.6.0"
async-channel = "2.5.0"
cef = { version = "156.7.0", default-features = false }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14", "gio_v2_80"] }
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
oo7 = { version = "0.7.2", default-features = false, features = ["async-std", "native_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
